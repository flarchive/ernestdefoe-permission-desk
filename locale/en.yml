      nothing: Nothing to change. The selected tags already match.
      restrict_confirm: "Restrict {count, plural, one {this tag} other {these # tags}}? Each one starts with a copy of Everywhere's permissions (saved now and logged in History), so nothing changes for anyone until you edit them."
      restrict_note: "Restricted {tags}{count, plural, one {} =2 {} =3 {} other {, and more}}: copied Everywhere's permissions"
      restricted_done: "Restricted {count, plural, one {# tag} other {# tags}}. Their permissions match Everywhere until you change them."
      unrestrict_confirm: "Unrestrict {count, plural, one {this tag} other {these # tags}}? Their own permissions stop counting and Everywhere's apply in them again. Their own permissions are kept in case you restrict them again."
