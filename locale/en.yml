      note_placeholder: e.g. Let Support Team moderate in Support
      ack: I understand the risky changes above
      ack_help: Red flags need a tick before saving.
      via_core: "Saved through Flarum's own permission handler."
      keep_editing: Keep editing
      save: "Save {count, plural, one {# change} other {# changes}}"
      saved: "Saved {count, plural, one {# change} other {# changes}}."
      conflict: "Someone changed {what} since you opened this page. The review now shows what's there now; check it and save again."

    member:
      search: "Find a member: name, username or email"
      no_results: No members match.
      not_found: That member no longer exists.
      pick: Find a member to see what they can do, and why.
      admin: "Admin: can do everything"
      needs: "Needs \"{what}\" first"
      unconfirmed: "Email not confirmed: treated as a guest"
      suspended: "Suspended until {date}: treated as a guest"
      only_admins: Only Admins
      not_in: "Not in {groups}"
      verified: Email verified
      not_verified: Email not confirmed
      suspended_until: "Suspended until {date}"
      no_groups: No extra groups
      from: "Permissions come from: {groups}"
      guest_only: (only Everyone, see why below)
      open_desk: Open in Member Desk
      allowed: Allowed
      not_allowed: Not allowed
      staged_note: Unsaved changes are counted here, so you can see what they would do before saving.
      sum_admin: "{name} is an admin and can do everything, everywhere."
      sum_unconfirmed: "{name} hasn't confirmed their email, so Flarum treats them as a guest: they can read what guests can, but can't post, reply or like until they confirm."
      sum_suspended: "{name} is suspended until {date}, so Flarum treats them as a guest until then."
      sum: "{name} can read {has_hidden, select, 1 {everywhere except {hidden}} other {everywhere}}{start, select, 1 { and start discussions} other {}}. {mods, plural, =0 {No moderation permissions.} one {Has # moderation permission.} other {Has # moderation permissions.}}"
      sum_tag_hidden: "{name} can't see {tag} at all: it's a restricted tag and none of their groups is allowed in."
      sum_tag: "In {tag}, {name} can read{start, select, 1 {, start discussions} other {}}{reply, select, 1 { and reply} other {, but can't reply}}. {mods, plural, =0 {No moderation permissions here.} one {Has # moderation permission here.} other {Has # moderation permissions here.}}"
      limit: "This is what {name}'s groups allow. Other extensions can add their own rules (a locked discussion, Trust Levels' new-member limits, a post-count gate), so a ✓ here is needed but not always enough."

    history:
      filter: Filter by permission or note
      help: "Every save is one entry. Undo reverses one entry; Restore to here puts every permission back the way it was right after that entry. Both open the review first. Changes made elsewhere (the classic grid, an extension, a command) are logged too."
      empty: No changes yet.
      more: Load more
      outside: Outside Permission Desk
      outside_help: Found by the outside-change check, e.g. the classic grid, an extension's install or a direct database edit.
      changes: "{count, plural, one {# change} other {# changes}}"
      in: "in {tag}"
      kind_outside: outside
      kind_undo: "undo of #{id}"
      kind_restore: restore
      undone: undone
      undo: Undo
      restore: Restore to here
      undo_note: "Undo of #{id}"
      restore_note: "Restore to #{id}"
      nothing_to_undo: "Nothing to undo: {what} changed again since."
      already: Already matches that point.

    desc:
      viewForum: Can open the forum and read discussions.
      viewHiddenGroups: Can see groups marked hidden, and who is in them.
      searchUsers: Can search for members by name.
      user_viewLastSeenAt: "Can see when members were last online, even when a member hides it."
      startDiscussion: Can start new discussions.
      createAccessToken: Can make API tokens for their own account.
      user_editAvatar: Can upload or change their own avatar.
      discussion_reply: Can post replies.
      discussion_viewIpsPosts: Can see the IP address each post was made from.
      discussion_rename: "Can change any discussion's title."
      discussion_hide: Can hide discussions. They can be restored.
      discussion_delete: "Can permanently delete discussions. They can't be restored."
      postWithoutThrottle: Skips the flood limit between posts.
      discussion_editPosts: "Can edit anyone's posts."
      discussion_hidePosts: "Can hide anyone's posts. They can be restored."
      discussion_deletePosts: "Can permanently delete anyone's posts. They can't be restored."
      user_editCredentials: "Can change anyone's email and password."
      user_editGroups: Can add people to groups, including their own group.
      user_edit: "Can change members' names and profile details."
      moderateAccessTokens: "Can see and revoke anyone's API tokens."
      discussion_tag: Can move any discussion to other tags.
      discussion_lock: Can stop replies to a discussion.
      discussion_sticky: Can pin a discussion to the top.
      discussion_likePosts: "Can like other members' posts."
      discussion_flagPosts: Can report posts to moderators.
      discussion_viewFlags: Sees reported posts and can dismiss reports.
      discussion_approvePosts: Can approve posts held for review.
      discussion_replyWithoutApproval: "Replies don't wait for approval."
      discussion_startWithoutApproval: "Discussions don't wait for approval."
      user_suspend: Can suspend members for a time or forever.
      discussion_hideOwnPosts: Can hide their own posts.
      startConversation: Can start private conversations.
      mentionGroups: Can mention whole groups.
      ernestdefoe_member_desk_view: Can open Member Desk (emails masked).
      ernestdefoe_member_desk_viewEmails: "Sees members' email addresses in Member Desk."
      ernestdefoe_member_desk_viewIps: Sees IP addresses and other accounts on the same IP.
      ernestdefoe_member_desk_markSpammer: "Can mark spammers: suspend, hide their content and ban their IPs."
      ernestdefoe_member_desk_export: Can export members as CSV, emails included.

  # Errors the API returns (shown to the admin as a validation alert).
  api:
    nothing_to_save: Nothing to save.
    not_a_permission: That isn't a permission name.
    no_such_group: "There is no group {id}."
    not_undoable: That entry can no longer be undone.
    no_such_entry: That History entry doesn't exist.
    already_undone: That entry has already been undone.
