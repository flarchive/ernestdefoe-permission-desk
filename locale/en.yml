      select: "Select {tag}"
      expand: "Show the tags inside {tag}"
      collapse: "Hide the tags inside {tag}"
      restricted: "Restricted: only its own permissions count inside it"
      parent_hidden: parent hidden
      parent_hidden_help: "This group can't see {parent}, and Flarum hides a child tag from anyone who can't see its parent."
      open_note: "Not restricted: uses Everywhere's permissions"
      open_short: Not restricted
