    differences_short: "{count, plural, one {# difference} other {# differences}}"

    filter:
      label: Show
      all: All
      guests: Everyone can
      one: Only one group
      none: Admins only
      danger: Danger flags
      other: Not registered

    other:
      title: "Stored, but no enabled extension registers it"
      help: Probably left by an extension that was removed or switched off. Clearing it is safe if that extension is gone for good.
      clear: Clear
      none: Nothing left behind by other extensions.

    flag:
      guests: Anyone, signed in or not, could do this
      members: Every member could do this
      members_only: Your forum becomes members-only
      admins_only: Only admins will be able to do this
      risky: "{what}"
      sensitive: "Sensitive: {what}"

    copy:
      button: Copy…
      title: Copy permissions
      from: From
      to: to
      replace: Replace
      replace_help: "{to} ends up with exactly what {from} has."
      add: Add only
      add_help: "Grant {to} anything {from} has; take nothing away."
      tags: "Include restricted tags ({count, plural, one {# tag} other {# tags}})"
      count: "{count, plural, =0 {Nothing to change: they already match.} one {# change will be staged. You'll see it in the review before anything is saved.} other {# changes will be staged. You'll see each one in the review before anything is saved.}}"

    preset:
      button: Apply preset…
      title: "Apply a preset to {group}"
      readonly: Read only
      readonly_help: Can read and search; can't post, reply or like.
      member: Member (Flarum's default)
      member_help: Start discussions, reply, like, flag and vote.
      trusted: Trusted member
      trusted_help: Member, plus uploads, polls, access tokens and no flood limit.
      mod: Moderator
      mod_help: Everyday moderation; nothing that deletes forever or changes sign-ins, groups or tokens.
      tagmod: Tag moderator
      tagmod_help: Everyday moderation inside every restricted tag only; nothing global changes.
      own_help: "Saved preset · {count, plural, one {# permission} other {# permissions}}"
      count: "{add} to grant, {remove} to remove. Permissions of extensions that aren't installed are skipped."
      save: "Save {group} as a preset"
      save_label: Preset name
      save_placeholder: "Name, e.g. {group} (2026)"
      delete: Delete this preset

    savebar:
      count: "{count, plural, one {# unsaved change} other {# unsaved changes}}"
      discard: Discard
      review: Review & save

    review:
      title: "Review {count, plural, one {# change} other {# changes}}"
      count: "{count, plural, one {# change} other {# changes}}"
      can: "Can {what}"
      cannot: "Can no longer {what}"
      needs: "Won't take effect until they also have: {what}"
      in_tags: "in {count} tags"
      skipped: "Skipped because they changed again since: {what}"
